name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_DOCTOR: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Resolve workspace and scheme
        id: xcode
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1 | sed 's|^\./||')"
          PROJECT="$(find . -maxdepth 1 -name '*.xcodeproj' | head -1 | sed 's|^\./||')"
          if [ -z "$WORKSPACE" ] || [ -z "$PROJECT" ]; then
            echo "::error::No xcworkspace/xcodeproj generated by prebuild"
            ls -la
            exit 1
          fi
          SCHEME="$(xcodebuild -project "$PROJECT" -list -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print(s[0] if s else "")')"
          if [ -z "$SCHEME" ]; then
            SCHEME="$(basename "$PROJECT" .xcodeproj)"
          fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE scheme=$SCHEME"

      - name: Archive without code signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "ios/${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No .app produced by the archive"
            exit 1
          fi
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          rm -rf "$STAGE/Payload"/*/_CodeSignature
          rm -f "$STAGE/Payload"/*/embedded.mobileprovision
          cd "$STAGE"
          zip -qry "$RUNNER_TEMP/App.ipa" Payload
          ls -lh "$RUNNER_TEMP/App.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/App.ipa
          if-no-files-found: error
          retention-days: 14
